name: Tests

on:
  pull_request:
    branches-ignore:  # build.yml already runs tests on PRs to main
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"

      - name: Install pipenv
        run: pip install pipenv

      - name: Set up project environment
        run: make setup

      - name: Install project package
        run: make install-self

      - name: Lint Storm packages
        run: make lint-storm

      - name: Run tests
        run: make tests
