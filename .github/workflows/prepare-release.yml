name: Prepare Release

# Cut a release entirely from GitHub: Actions -> Prepare Release -> Run workflow.
#
# This bumps the version in pyproject.toml and the package __init__.py, turns
# the "## Unreleased" CHANGELOG.md section into the new version's entry, commits
# to the default branch, creates and pushes an annotated v#.#.# tag, then the
# Release workflow runs (build, PyPI upload, GitHub Release, docs).
#
# Branch protection: if the default branch blocks direct pushes, add a
# RELEASE_TOKEN repository secret holding a token that may bypass that rule
# (e.g. a fine-grained PAT with "Contents: read and write" from an account on
# the rule's bypass list). It is used for the push when set; otherwise the
# default GITHUB_TOKEN is used.
#
# Tags pushed with RELEASE_TOKEN trigger release.yml's `push: tags` event
# themselves. Tags pushed with GITHUB_TOKEN do not, so in that case this
# workflow calls release.yml directly.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump (ignored if an explicit version is given)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Explicit version to release, e.g. 1.2.3 (optional, overrides bump)
        required: false
        type: string
      require_changelog:
        description: Fail if CHANGELOG.md has neither an Unreleased section with entries nor an entry for the new version
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      used_release_token: ${{ steps.token.outputs.used_release_token }}

    steps:
      - name: Require default branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Releases must be cut from ${{ github.event.repository.default_branch }} (got ${{ github.ref_name }})"
          exit 1

      - name: Choose push token
        id: token
        env:
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: echo "used_release_token=${HAS_RELEASE_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipenv
        run: pip install pipenv

      - name: Set up project environment
        run: make setup

      - name: Install project package
        run: make install-self

      - name: Run tests
        run: make tests

      - name: Determine new version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          new_version="$(python3 - <<'PY'
          import os, re, sys, tomllib

          current = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          explicit = os.environ.get("EXPLICIT", "").strip().lstrip("v")
          semver = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")

          if explicit:
              if not semver.match(explicit):
                  sys.exit(f"Invalid version {explicit!r}; expected #.#.#")
              print(explicit)
              sys.exit(0)

          m = semver.match(current)
          if not m:
              sys.exit(f"Current version {current!r} is not #.#.#; pass an explicit version")
          major, minor, patch = map(int, m.groups())
          bump = os.environ["BUMP"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          print(f"{major}.{minor}.{patch}")
          PY
          )"
          echo "New version: ${new_version}"
          if git rev-parse -q --verify "refs/tags/v${new_version}" >/dev/null; then
            echo "::error::Tag v${new_version} already exists"
            exit 1
          fi
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG
        env:
          REQUIRE: ${{ inputs.require_changelog }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! python3 scripts/changelog.py release "${VERSION}"; then
            if [ "${REQUIRE}" = "true" ]; then
              echo "::error::CHANGELOG.md has no entries under '## Unreleased' and no '## v${VERSION}' entry"
              exit 1
            fi
            echo "::warning::CHANGELOG.md has no entries for v${VERSION}; the GitHub Release will only have auto-generated notes"
          fi

      - name: Bump version
        run: make change-version VERSION=${{ steps.version.outputs.version }}

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/stormlibpp/__init__.py CHANGELOG.md
          git commit -m "build: release v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/v${VERSION}"

  release:
    needs: tag
    # With RELEASE_TOKEN the tag push already triggered release.yml.
    if: needs.tag.outputs.used_release_token != 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
