[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "stormlibpp"
version = "0.12.1"
description = "The StormLib++ Python package"
readme = "README.md"
requires-python = ">=3.11"

# Fill in dependencies here.
dependencies = [
    "synapse>=2.225.0,<3"
]

[[project.authors]]
name = "John Gorman"

[project.license]
file = "LICENSE"

[project.urls]
Homepage = "https://github.com/gormaniac/stormlibpp"
Documentation = "https://docs.gormo.co/stormlibpp/"

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

[tool.pytest.ini_options]
# Python deprecations raised from StormLib++'s own code fail the tests. Synapse's
# deprecations are logged instead, tests/conftest.py fails the tests for those.
filterwarnings = [
    "error::DeprecationWarning:stormlibpp",
]
